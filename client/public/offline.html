<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>WebQuiz Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Segoe UI, system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 20px 40px -16px rgb(15 23 42 / 0.18);
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #eef2ff;
        color: #4f46e5;
        font-weight: 900;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }
      p {
        margin: 12px 0 0;
        color: #475569;
        line-height: 1.6;
      }
      button {
        margin-top: 22px;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        font-weight: 700;
        padding: 0 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">W</div>
      <h1>You are offline</h1>
      <p>
        WebQuiz cannot reach the network right now. Reconnect and refresh to continue.
        During an active exam, keep the exam screen open until your answers sync.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
