<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use-Case Diagram – High School Learning Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #f1f5f9; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        #canvas-wrap { flex: 1; overflow: auto; cursor: grab; position: relative; background: #f1f5f9; }
        #canvas-wrap:active { cursor: grabbing; }
        #canvas-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
        #canvas-wrap::-webkit-scrollbar-track { background: transparent; }
        #canvas-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .uc-node { cursor: pointer; }
        .uc-node:hover .uc-ring { stroke-width: 2.8; filter: url(#glow); }
        .uc-node.focused .uc-ring { stroke-width: 3.2; stroke-dasharray: none; filter: url(#glow); }
        .actor-fig { cursor: pointer; }

        #tooltip {
            position: fixed; max-width: 340px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 14px 18px;
            font-size: 13px; line-height: 1.6; display: none; z-index: 999; pointer-events: none;
        }
        #tooltip .tid { font-weight: 700; color: #3b82f6; }
        #tooltip .tname { font-weight: 600; color: #0f172a; margin-left: 4px; }
        #tooltip .tdesc { color: #475569; margin-top: 6px; display: block; }

        /* Sidebar */
        #sidebar {
            width: 275px; min-width: 275px; background: #fff; border-left: 1px solid #e2e8f0;
            overflow-y: auto; transition: all .25s ease; display: flex; flex-direction: column;
        }
        #sidebar.collapsed { width: 0; min-width: 0; padding: 0; border: none; overflow: hidden; }
        #sidebar::-webkit-scrollbar { width: 5px; }
        #sidebar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
        .sb-head { padding: 14px 16px 10px; border-bottom: 1px solid #f1f5f9; }
        .sb-stats { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .sb-stat { font-size: 11px; color: #64748b; background: #f8fafc; padding: 3px 8px; border-radius: 6px; }
        .sb-stat b { color: #334155; }
        .sb-body { flex: 1; overflow-y: auto; padding: 6px 0; }
        .sb-group-hdr {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px; cursor: pointer;
            font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
            user-select: none; transition: background .15s;
        }
        .sb-group-hdr:hover { background: #f8fafc; }
        .sb-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .sb-count { margin-left: auto; font-size: 10px; font-weight: 600; background: #f1f5f9; color: #64748b; padding: 1px 7px; border-radius: 10px; }
        .sb-chevron { font-size: 10px; color: #94a3b8; transition: transform .2s; }
        .sb-chevron.open { transform: rotate(90deg); }
        .sb-items { overflow: hidden; transition: max-height .25s ease; }
        .sb-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 34px;
            font-size: 12px; cursor: pointer; transition: background .12s; border-left: 3px solid transparent;
        }
        .sb-item:hover { background: #f8fafc; }
        .sb-item.active { background: #eff6ff; border-left-color: #3b82f6; }
        .sb-item-id { font-weight: 600; color: #94a3b8; font-size: 10px; min-width: 34px; }
        .sb-item-name { color: #334155; }

        .legend-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #64748b; padding: 2px 0; }
        .legend-line { width: 24px; height: 0; border-top: 2px dashed #64748b; }
        .legend-line.solid { border-top-style: solid; }
    </style>
</head>

<body class="flex flex-col h-screen">

    <!-- Toolbar -->

            <button onclick="zoomBy(.12)" class="w-7 h-7 rounded bg-gray-100 hover:bg-gray-200 text-base font-bold text-gray-500 grid place-items-center">+</button>
            <button onclick="fitToScreen()" class="h-7 px-2.5 rounded bg-gray-100 hover:bg-gray-200 text-[11px] font-semibold text-gray-600">Fit</button>
            <button onclick="toggleSidebar()" class="h-7 px-2 rounded bg-gray-100 hover:bg-gray-200 text-sm text-gray-500" title="Toggle sidebar">☰</button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-1 overflow-hidden">

        <div id="sidebar">

const rels = [
    { from:'UC06', to:'UC07', t:'include' },
    { from:'UC10', to:'UC11', t:'include' },{ from:'UC10', to:'UC12', t:'include' },{ from:'UC10', to:'UC13', t:'include' },
    { from:'UC16', to:'UC17', t:'include' },
    { from:'UC20', to:'UC21', t:'include' },
    { from:'UC30', to:'UC31', t:'include' },{ from:'UC30', to:'UC32', t:'include' },{ from:'UC30', to:'UC33', t:'include' },
    { from:'UC37', to:'UC39', t:'include' },
    { from:'UC04', to:'UC01', t:'extend' },
    { from:'UC08', to:'UC06', t:'extend' },
    { from:'UC24', to:'UC23', t:'extend' },{ from:'UC25', to:'UC23', t:'extend' },
    { from:'UC27', to:'UC26', t:'extend' },
    { from:'UC34', to:'UC30', t:'extend' },
    { from:'UC38', to:'UC37', t:'extend' },
];

// ─── SVG HELPERS ───────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs, par) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (par) par.appendChild(e);
    return e;
}
function ePt(cx, cy, tx, ty) {
    const a = Math.atan2(ty-cy, tx-cx);
    return { x: cx + RX*Math.cos(a), y: cy + RY*Math.sin(a) };
}
function wrap(t, max) {
    if (t.length <= max) return [t];
    const m = Math.floor(t.length/2);
    let i = t.lastIndexOf(' ', m+5);
    if (i <= 2) i = t.indexOf(' ', m);
    if (i < 0) return [t];
    return [t.slice(0,i), t.slice(i+1)];
}

// ─── COMPUTE SUBSYSTEM BOUNDS ──────────────────────────
function computeBounds() {
    const res = {};
    for (const gid of groupOrder) {
        const gu = ucs.filter(u => u.g === gid);
        if (!gu.length) continue;
        const px = 28, pt = 32, pb = 18;
        const x1 = Math.min(...gu.map(u => u.x - RX)) - px;
        const y1 = Math.min(...gu.map(u => u.y - RY)) - pt;
        const x2 = Math.max(...gu.map(u => u.x + RX)) + px;
        const y2 = Math.max(...gu.map(u => u.y + RY)) + pb;
        res[gid] = { x:x1, y:y1, w:x2-x1, h:y2-y1 };
    }
    return res;
}

// ─── ZOOM & PAN ────────────────────────────────────────
const svgEl = document.getElementById('svg');
const wrapEl = document.getElementById('canvas-wrap');
let scale = 0.72, gRoot;

function applyZoom() {
    svgEl.setAttribute('width', CW*scale);
    svgEl.setAttribute('height', CH*scale);
    gRoot.setAttribute('transform', `scale(${scale})`);
    document.getElementById('zoom-pct').textContent = Math.round(scale*100) + '%';
}
function zoomBy(d) { scale = Math.max(.25, Math.min(2.2, scale+d)); applyZoom(); }
function fitToScreen() {
    const cw = wrapEl.clientWidth, ch = wrapEl.clientHeight;
    scale = Math.min(cw/CW, ch/CH) * .97;
    applyZoom();
    wrapEl.scrollTo({ left:0, top:0, behavior:'smooth' });
}

// ─── TOOLTIP ───────────────────────────────────────────
const tip = document.getElementById('tooltip');
function showTip(ev, uc) {
    tip.querySelector('.tid').textContent = uc.id;
    tip.querySelector('.tname').textContent = ' – ' + uc.name;
    tip.querySelector('.tdesc').textContent = uc.desc;
    tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX+14, innerWidth-360)+'px';
    tip.style.top = Math.min(ev.clientY+14, innerHeight-100)+'px';
}
function hideTip() { tip.style.display = 'none'; }

// ─── FILTER ────────────────────────────────────────────
let curFilter = 'all';
function setFilter(f) {
    curFilter = f;
    document.querySelectorAll('.fbtn').forEach(b => {
        const active = b.dataset.f === f;
        b.style.fontWeight = active ? '800' : '600';
        if (f === 'all') {
            b.style.background = b.dataset.f === 'all' ? '#1e293b' : '';
            b.style.color = b.dataset.f === 'all' ? '#fff' : '';
        } else {
            b.style.background = active ? actorMap[f]?.color || '#1e293b' : '';
            b.style.color = active ? '#fff' : '';
        }
    });
    applyVis();
}

function applyVis() {
    const f = curFilter;
    document.querySelectorAll('.assoc-path').forEach(p => {
        const a = p.dataset.actor;
        p.style.opacity = f==='all' ? .65 : a===f ? 1 : .06;
        p.style.strokeWidth = f==='all' ? 1.3 : a===f ? 2 : .5;
    });
    document.querySelectorAll('.uc-node').forEach(n => {
        const ga = groupToActors[n.dataset.group] || [];
        n.style.opacity = f==='all' ? 1 : ga.includes(f) ? 1 : .14;
    });
    document.querySelectorAll('.actor-fig').forEach(g => {
        g.style.opacity = f==='all' ? 1 : g.dataset.actor===f ? 1 : .15;
    });
    document.querySelectorAll('.rel-g').forEach(g => {
        const fg = ucMap[g.dataset.from]?.g, tg = ucMap[g.dataset.to]?.g;
        const a = [...(groupToActors[fg]||[]),...(groupToActors[tg]||[])];
        g.style.opacity = f==='all' ? .85 : a.includes(f) ? 1 : .08;
    });
    document.querySelectorAll('.sub-bg').forEach(r => {
        const ga = groupToActors[r.dataset.group] || [];
        r.style.opacity = f==='all' ? 1 : ga.includes(f) ? 1 : .15;
    });
}

// ─── SIDEBAR ───────────────────────────────────────────
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
let focusedUC = null;
function focusUC(id) {
    focusedUC = focusedUC === id ? null : id;
    document.querySelectorAll('.uc-node').forEach(n => n.classList.toggle('focused', n.dataset.id === focusedUC));
    document.querySelectorAll('.sb-item').forEach(i => i.classList.toggle('active', i.dataset.uc === focusedUC));
    if (focusedUC) {
        const uc = ucMap[focusedUC];
        const cx = uc.x*scale - wrapEl.clientWidth/2;
        const cy = uc.y*scale - wrapEl.clientHeight/2;
        wrapEl.scrollTo({ left:cx, top:cy, behavior:'smooth' });
    }
}
function buildSidebar() {
    const el = document.getElementById('sb-list');
    let h = '';
    for (const gid of groupOrder) {
        const g = groups[gid];
        const gu = ucs.filter(u => u.g === gid);
        h += `<div class="sb-group">
            <div class="sb-group-hdr" onclick="this.nextElementSibling.style.maxHeight = this.nextElementSibling.style.maxHeight ? '' : '600px'; this.querySelector('.sb-chevron').classList.toggle('open')">
                <span class="sb-dot" style="background:${g.color}"></span>
                <span style="color:${g.color}">${g.label}</span>
                <span class="sb-count">${gu.length}</span>
                <span class="sb-chevron open">▸</span>
            </div>
            <div class="sb-items" style="max-height:600px">`;
        gu.forEach(u => {
            h += `<div class="sb-item" data-uc="${u.id}" onclick="focusUC('${u.id}')">
                <span class="sb-item-id">${u.id}</span><span class="sb-item-name">${u.name}</span></div>`;
        });
        h += `</div></div>`;
    }
    el.innerHTML = h;
}

// ─── RENDER ────────────────────────────────────────────
function render() {
    svgEl.setAttribute('viewBox', `0 0 ${CW} ${CH}`);
    gRoot = mk('g', {}, svgEl);

    // Defs: shadows & glow
    const defs = mk('defs', {}, gRoot);
    const fShadow = mk('filter', { id:'shadow', x:'-10%', y:'-10%', width:'130%', height:'140%' }, defs);
    mk('feDropShadow', { dx:0, dy:2, stdDeviation:3, 'flood-opacity':.08 }, fShadow);
    const fGlow = mk('filter', { id:'glow', x:'-20%', y:'-20%', width:'140%', height:'140%' }, defs);
    mk('feDropShadow', { dx:0, dy:0, stdDeviation:5, 'flood-color':'#3b82f6', 'flood-opacity':.3 }, fGlow);

    // System boundary
    mk('rect', { x:260, y:60, width:2080, height:1830, rx:16, fill:'#ffffff', stroke:'#94a3b8', 'stroke-width':2.2 }, gRoot);
    mk('text', { x:1300, y:44, 'text-anchor':'middle', 'font-size':14.5, 'font-weight':'700', fill:'#1e293b', 'letter-spacing':'.3' }, gRoot).textContent = 'High School Learning Analytics Dashboard';

    // Subsystem backgrounds (auto-computed)
    const bounds = computeBounds();
    for (const [gid, b] of Object.entries(bounds)) {
        const g = groups[gid];
        const bg = mk('g', { class:'sub-bg', 'data-group':gid }, gRoot);
        mk('rect', { x:b.x, y:b.y, width:b.w, height:b.h, rx:10, fill:g.bg, stroke:g.border, 'stroke-width':1.2, 'stroke-dasharray':'6 3' }, bg);
        mk('text', { x:b.x+10, y:b.y+15, 'font-size':10, 'font-weight':'700', fill:g.color, 'dominant-baseline':'hanging', opacity:.85 }, bg).textContent = g.label;
    }

    // Auth "shared" annotation
    const authB = bounds['auth'];
    if (authB) {
        const noteG = mk('g', {}, gRoot);
        const nx = authB.x + authB.w/2, ny = authB.y + authB.h + 14;
        mk('rect', { x:nx-72, y:ny-10, width:144, height:20, rx:10, fill:'#f1f5f9', stroke:'#cbd5e1', 'stroke-width':.8 }, noteG);
        mk('text', { x:nx, y:ny+4, 'text-anchor':'middle', 'font-size':9, fill:'#64748b', 'font-weight':'600' }, noteG).textContent = 'Dùng chung: Tất cả Actors';
    }

    // Vertical divider between left & right halves
    mk('line', { x1:1300, y1:295, x2:1300, y2:1870, stroke:'#e2e8f0', 'stroke-width':1, 'stroke-dasharray':'4 4' }, gRoot);

    // ── Association lines ──
    const assocLayer = mk('g', {}, gRoot);
    assocs.forEach(as => {
        const ac = actorMap[as.a], uc = ucMap[as.u];
        if (!ac || !uc) return;
        const ep = ePt(uc.x, uc.y, ac.x, ac.y);
        mk('line', {
            x1:ac.x, y1:ac.y, x2:ep.x, y2:ep.y,
            stroke:ac.color, 'stroke-width':1.3, 'stroke-opacity':.65,
            class:'assoc-path', 'data-actor':as.a
        }, assocLayer);
    });

    // ── Relationship lines (include / extend) ──
    const relLayer = mk('g', {}, gRoot);
    rels.forEach(r => {
        const fr = ucMap[r.from], to = ucMap[r.to];
        if (!fr || !to) return;
        const p1 = ePt(fr.x, fr.y, to.x, to.y);
        const p2 = ePt(to.x, to.y, fr.x, fr.y);
        const rg = mk('g', { class:'rel-g', 'data-from':r.from, 'data-to':r.to }, relLayer);
        const isInc = r.t === 'include';
        const col = isInc ? '#6366f1' : '#f59e0b';
        mk('line', { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:col, 'stroke-width':1.2, 'stroke-dasharray':'5 3' }, rg);
        // Arrowhead
        const ang = Math.atan2(p2.y-p1.y, p2.x-p1.x);
        const a1x = p2.x-9*Math.cos(ang-.4), a1y = p2.y-9*Math.sin(ang-.4);
        const a2x = p2.x-9*Math.cos(ang+.4), a2y = p2.y-9*Math.sin(ang+.4);
        mk('polygon', { points:`${p2.x},${p2.y} ${a1x},${a1y} ${a2x},${a2y}`, fill:col }, rg);
        // Label
        const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
        mk('rect', { x:mx-30, y:my-8, width:60, height:15, rx:3, fill:'#fff', 'fill-opacity':.93 }, rg);
        const lbl = isInc ? '«include»' : '«extend»';
        mk('text', { x:mx, y:my+4, 'text-anchor':'middle', 'font-size':8, fill:col, 'font-style':'italic', 'font-weight':'600' }, rg).textContent = lbl;
    });

    // ── Use Case Ellipses ──
    const ucLayer = mk('g', {}, gRoot);
    ucs.forEach(uc => {
        const g = mk('g', { class:'uc-node', 'data-id':uc.id, 'data-group':uc.g }, ucLayer);
        const gc = groups[uc.g]?.color || '#64748b';
        mk('ellipse', { cx:uc.x, cy:uc.y, rx:RX, ry:RY, fill:'#fff', filter:'url(#shadow)', class:'uc-bg' }, g);
        mk('ellipse', { cx:uc.x, cy:uc.y, rx:RX, ry:RY, fill:'none', stroke:gc, 'stroke-width':1.8, class:'uc-ring' }, g);

        const lines = wrap(uc.name, 22);
        if (lines.length === 1) {
            mk('text', { x:uc.x, y:uc.y+4, 'text-anchor':'middle', 'font-size':10.5, fill:'#1e293b', 'font-weight':'500' }, g).textContent = lines[0];
        } else {
            mk('text', { x:uc.x, y:uc.y-4, 'text-anchor':'middle', 'font-size':10, fill:'#1e293b', 'font-weight':'500' }, g).textContent = lines[0];
            mk('text', { x:uc.x, y:uc.y+10, 'text-anchor':'middle', 'font-size':10, fill:'#1e293b', 'font-weight':'500' }, g).textContent = lines[1];
        }
        mk('text', { x:uc.x, y:uc.y-RY-6, 'text-anchor':'middle', 'font-size':8.5, fill:'#94a3b8', 'font-weight':'700' }, g).textContent = uc.id;

        g.addEventListener('mouseenter', e => showTip(e, uc));
        g.addEventListener('mousemove', e => showTip(e, uc));
        g.addEventListener('mouseleave', hideTip);
        g.addEventListener('click', () => focusUC(uc.id));
    });

    // ── Actors ──
    const actorLayer = mk('g', {}, gRoot);
    actors.forEach(a => {
        const g = mk('g', { class:'actor-fig', 'data-actor':a.id, transform:`translate(${a.x},${a.y})` }, actorLayer);
        // White background circle for clarity
        mk('circle', { cx:0, cy:-30, r:14, fill:'#fff', stroke:a.color, 'stroke-width':2.4 }, g);
        // Body
        mk('line', { x1:0, y1:-16, x2:0, y2:14, stroke:a.color, 'stroke-width':2.4 }, g);
        mk('line', { x1:-18, y1:-2, x2:18, y2:-2, stroke:a.color, 'stroke-width':2.4 }, g);
        mk('line', { x1:0, y1:14, x2:-14, y2:36, stroke:a.color, 'stroke-width':2.4 }, g);
        mk('line', { x1:0, y1:14, x2:14, y2:36, stroke:a.color, 'stroke-width':2.4 }, g);
        // Label
        mk('text', { x:0, y:55, 'text-anchor':'middle', 'font-size':13, 'font-weight':'700', fill:a.color }, g).textContent = a.label;
        mk('text', { x:0, y:69, 'text-anchor':'middle', 'font-size':10, fill:a.color, 'font-style':'italic', opacity:.7 }, g).textContent = '(' + a.sub + ')';
    });

    applyZoom();
    applyVis();
}

// ─── INIT ──────────────────────────────────────────────
wrapEl.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? .08 : -.08); }, { passive:false });
render();
buildSidebar();
setTimeout(fitToScreen, 80);
</script>
</body>
