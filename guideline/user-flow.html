const NS='http://www.w3.org/2000/svg';
function mk(t,a,p){const e=document.createElementNS(NS,t);if(a)for(const[k,v]of Object.entries(a))e.setAttribute(k,v);if(p)p.appendChild(e);return e}

const NW=180,NH=52;
const portDims={start:{hw:60,hh:18},end:{hw:60,hh:18},process:{hw:90,hh:26},decision:{hw:60,hh:35}};
function gp(n,d){const p=portDims[n.type];switch(d){case'top':return{x:n.x,y:n.y-p.hh};case'bottom':return{x:n.x,y:n.y+p.hh};case'left':return{x:n.x-p.hw,y:n.y};case'right':return{x:n.x+p.hw,y:n.y}}}

function route(a,b,fd,td){
    if(fd==='bottom'&&td==='top'){
        if(Math.abs(a.x-b.x)<3)return`M${a.x},${a.y}L${b.x},${b.y}`;
        const m=(a.y+b.y)/2;return`M${a.x},${a.y}L${a.x},${m}L${b.x},${m}L${b.x},${b.y}`;
    }
    if((fd==='left'||fd==='right')&&td==='top')return`M${a.x},${a.y}L${b.x},${a.y}L${b.x},${b.y}`;
    if(fd==='bottom'&&(td==='left'||td==='right'))return`M${a.x},${a.y}L${a.x},${b.y}L${b.x},${b.y}`;
    if((fd==='left'||fd==='right')&&(td==='left'||td==='right')){const mx=(a.x+b.x)/2;return`M${a.x},${a.y}L${mx},${a.y}L${mx},${b.y}L${b.x},${b.y}`}
    return`M${a.x},${a.y}L${b.x},${b.y}`;
}

function arrow(g,x,y,dir,c){
    const s=5;let pts;
    switch(dir){
        case'top':pts=`${x},${y} ${x-s},${y-s*1.5} ${x+s},${y-s*1.5}`;break;
        case'bottom':pts=`${x},${y} ${x-s},${y+s*1.5} ${x+s},${y+s*1.5}`;break;
        case'left':pts=`${x},${y} ${x-s*1.5},${y-s} ${x-s*1.5},${y+s}`;break;
        case'right':pts=`${x},${y} ${x+s*1.5},${y-s} ${x+s*1.5},${y+s}`;break;
    }
    mk('polygon',{points:pts,fill:c||'#94a3b8'},g);
}

/* ── RENDER ─────────────────────────────────────────── */
const svgEl=document.getElementById('svg'),wrapEl=document.getElementById('canvas-wrap');
let scale=.85,curFlow='student',gRoot;

function renderFlow(fid){
    const f=flows[fid],nm={};f.nodes.forEach(n=>nm[n.id]=n);
    svgEl.innerHTML='';
    svgEl.setAttribute('viewBox',`0 0 ${f.cw} ${f.ch}`);
    gRoot=mk('g',{},svgEl);

    const defs=mk('defs',{},gRoot);
    const fs=mk('filter',{id:'shadow',x:'-10%',y:'-10%',width:'130%',height:'140%'},defs);
    mk('feDropShadow',{dx:0,dy:2,stdDeviation:3,'flood-opacity':.07},fs);
    const fg=mk('filter',{id:'glow',x:'-20%',y:'-20%',width:'140%',height:'140%'},defs);
    mk('feDropShadow',{dx:0,dy:0,stdDeviation:5,'flood-color':f.color,'flood-opacity':.3},fg);

    mk('rect',{x:8,y:8,width:f.cw-16,height:f.ch-16,rx:16,fill:'#ffffff',stroke:'#e2e8f0','stroke-width':1.2},gRoot);

    // edges
    const eL=mk('g',{},gRoot);
    f.edges.forEach(e=>{
        const fn=nm[e.from],tn=nm[e.to];if(!fn||!tn)return;
        const fd=e.fp||'bottom',td=e.tp||'top';
        const p1=gp(fn,fd),p2=gp(tn,td);
        const dashed=fn.opt||tn.opt;
        mk('path',{d:route(p1,p2,fd,td),fill:'none',stroke:e.color||'#94a3b8','stroke-width':dashed?1.3:1.6,'stroke-dasharray':dashed?'6 3':'none'},eL);
        arrow(eL,p2.x,p2.y,td,e.color||'#94a3b8');
        if(e.label){
            let lx,ly;
            if(fd==='left'){lx=p1.x-14;ly=p1.y-8}
            else if(fd==='right'){lx=p1.x+14;ly=p1.y-8}
            else{lx=p1.x+12;ly=p1.y+14}
            const tw=e.label.length*7+10;
            mk('rect',{x:lx-tw/2,y:ly-9,width:tw,height:16,rx:3,fill:'#fff','fill-opacity':.95},eL);
            mk('text',{x:lx,y:ly+2,'text-anchor':'middle','font-size':9,fill:'#64748b','font-weight':'600','font-style':'italic'},eL).textContent=e.label;
        }
    });

    // forks
    if(f.forks)f.forks.forEach(fk=>{
        const fkg=mk('g',{},gRoot);
        const fn=nm[fk.from],port=gp(fn,fk.port||'bottom'),by=fk.barY;
        const xs=fk.branches.map(b=>nm[b.to].x);
        mk('line',{x1:port.x,y1:port.y,x2:port.x,y2:by,stroke:'#94a3b8','stroke-width':1.6},fkg);
        mk('line',{x1:Math.min(...xs),y1:by,x2:Math.max(...xs),y2:by,stroke:'#94a3b8','stroke-width':1.6},fkg);
        fk.branches.forEach(b=>{
            const tn=nm[b.to],tp=gp(tn,'top');
            mk('line',{x1:tn.x,y1:by,x2:tp.x,y2:tp.y,stroke:'#94a3b8','stroke-width':1.6},fkg);
            arrow(fkg,tp.x,tp.y,'top','#94a3b8');
            if(b.label){
                const ly=by+14,tw=b.label.length*6.5+14;
                mk('rect',{x:tn.x-tw/2,y:ly-10,width:tw,height:17,rx:4,fill:f.bg,stroke:f.color,'stroke-width':.6,'stroke-opacity':.4},fkg);
                mk('text',{x:tn.x,y:ly+3,'text-anchor':'middle','font-size':9.5,fill:f.color,'font-weight':'700'},fkg).textContent=b.label;
            }
        });
    });

    // merges
    if(f.merges)f.merges.forEach(mg=>{
        const mG=mk('g',{},gRoot);
        const tn=nm[mg.to],tp=gp(tn,mg.port||'top'),by=mg.barY;
        const xs=mg.branches.map(bid=>nm[bid].x);
        mg.branches.forEach(bid=>{
            const bn=nm[bid],bp=gp(bn,'bottom');
            mk('line',{x1:bp.x,y1:bp.y,x2:bn.x,y2:by,stroke:'#cbd5e1','stroke-width':1.2,'stroke-dasharray':'4 3'},mG);
        });
        mk('line',{x1:Math.min(...xs),y1:by,x2:Math.max(...xs),y2:by,stroke:'#cbd5e1','stroke-width':1.2,'stroke-dasharray':'4 3'},mG);
        mk('line',{x1:tp.x,y1:by,x2:tp.x,y2:tp.y,stroke:'#94a3b8','stroke-width':1.6},mG);
        arrow(mG,tp.x,tp.y,'top','#94a3b8');
    });

    // nodes
    const nL=mk('g',{},gRoot);
    f.nodes.forEach(n=>{
        const g=mk('g',{class:'flow-node','data-id':n.id},nL);
        const lines=n.label.split('\n');

        if(n.type==='start'||n.type==='end'){
            const fc=n.type==='start'?'#10b981':'#6b7280';
            mk('rect',{x:n.x-60,y:n.y-18,width:120,height:36,rx:18,fill:fc,class:'node-bg'},g);
            mk('text',{x:n.x,y:n.y+5,'text-anchor':'middle','font-size':13,fill:'#fff','font-weight':'600'},g).textContent=n.label;
        }
        else if(n.type==='process'){
            const w=NW,h=NH;
            mk('rect',{x:n.x-w/2,y:n.y-h/2,width:w,height:h,rx:8,fill:'#fff',stroke:f.color,'stroke-width':n.opt?1.3:1.8,'stroke-dasharray':n.opt?'5 3':'none',filter:'url(#shadow)',class:'node-bg'},g);
            mk('rect',{x:n.x-w/2,y:n.y-h/2,width:5,height:h,fill:f.color,rx:0,opacity:n.opt?.4:1,'clip-path':`inset(0 0 0 0 round 8px 0 0 8px)`},g);
            if(lines.length===1){
                mk('text',{x:n.x+2,y:n.y+4.5,'text-anchor':'middle','font-size':11.5,fill:'#1e293b','font-weight':'500'},g).textContent=lines[0];
            }else{
                mk('text',{x:n.x+2,y:n.y-4,'text-anchor':'middle','font-size':11,fill:'#1e293b','font-weight':'500'},g).textContent=lines[0];
                mk('text',{x:n.x+2,y:n.y+11,'text-anchor':'middle','font-size':11,fill:'#1e293b','font-weight':'500'},g).textContent=lines[1];
            }
            if(n.uc)mk('text',{x:n.x,y:n.y-h/2-5,'text-anchor':'middle','font-size':8.5,fill:'#94a3b8','font-weight':'700'},g).textContent=n.uc;
        }
        else if(n.type==='decision'){
            const dx=60,dy=35;
            mk('polygon',{points:`${n.x},${n.y-dy} ${n.x+dx},${n.y} ${n.x},${n.y+dy} ${n.x-dx},${n.y}`,fill:'#fffbeb',stroke:'#f59e0b','stroke-width':1.8,filter:'url(#shadow)',class:'node-bg'},g);
            if(lines.length===1){
                mk('text',{x:n.x,y:n.y+4,'text-anchor':'middle','font-size':11,fill:'#92400e','font-weight':'600'},g).textContent=lines[0];
            }else{
                mk('text',{x:n.x,y:n.y-4,'text-anchor':'middle','font-size':10.5,fill:'#92400e','font-weight':'600'},g).textContent=lines[0];
                mk('text',{x:n.x,y:n.y+10,'text-anchor':'middle','font-size':10.5,fill:'#92400e','font-weight':'600'},g).textContent=lines[1];
            }
        }

        if(n.uc&&uc[n.uc]){
            g.addEventListener('mouseenter',e=>showTip(e,n));
            g.addEventListener('mousemove',e=>showTip(e,n));
            g.addEventListener('mouseleave',hideTip);
        }
    });

    // Error/Exception annotations
    if(f.annotations)f.annotations.forEach(an=>{
        const ag=mk('g',{},gRoot);
        const lines=an.text.split('\n');
        const lh=13,pad=8,h=lines.length*lh+pad*2;
        mk('rect',{x:an.x,y:an.y,width:an.w,height:h,rx:6,fill:an.bg,stroke:an.color,'stroke-width':1.2,'stroke-dasharray':'4 2'},ag);
        mk('rect',{x:an.x,y:an.y,width:4,height:h,fill:an.color,rx:0,opacity:.8},ag);
        lines.forEach((l,i)=>{
            mk('text',{x:an.x+12,y:an.y+pad+i*lh+10,'font-size':9.5,fill:an.color,'font-weight':'600'},ag).textContent=l;
        });
    });

    applyZoom();
}

/* ── TOOLTIP ────────────────────────────────────────── */
const tip=document.getElementById('tooltip');
function showTip(ev,n){
    if(!n.uc||!uc[n.uc])return;
    const u=uc[n.uc];
    tip.querySelector('.tid').textContent=n.uc;
    tip.querySelector('.tname').textContent=' – '+u.n;
    tip.querySelector('.tdesc').textContent=u.d;
    tip.style.display='block';
    tip.style.left=Math.min(ev.clientX+14,innerWidth-340)+'px';
    tip.style.top=Math.min(ev.clientY+14,innerHeight-100)+'px';
}
function hideTip(){tip.style.display='none'}

/* ── SIDEBAR ────────────────────────────────────────── */
function buildSidebar(fid){
    const f=flows[fid];
    document.getElementById('sb-title').textContent=f.title;
    document.getElementById('sb-sub').textContent=f.sub;
    const el=document.getElementById('sb-list');
    let h='';
    f.nodes.forEach(n=>{
        if(n.type==='start'||n.type==='end'||n.type==='decision')return;
        const u=n.uc?uc[n.uc]:null;
        h+=`<div class="sb-step"><span class="sb-uc">${n.uc||''}</span><div><div class="sb-name">${n.label.replace(/\n/g,' ')}${n.opt?'<span class="sb-opt">Tùy chọn</span>':''}</div>${u?`<div class="sb-desc">${u.d}</div>`:''}</div></div>`;
    });
    el.innerHTML=h;
}

/* ── ZOOM / PAN ─────────────────────────────────────── */
function applyZoom(){
    const f=flows[curFlow];
    svgEl.setAttribute('width',f.cw*scale);
    svgEl.setAttribute('height',f.ch*scale);
    gRoot.setAttribute('transform',`scale(${scale})`);
    document.getElementById('zoom-pct').textContent=Math.round(scale*100)+'%';
}
function zoomBy(d){scale=Math.max(.3,Math.min(2,scale+d));applyZoom()}
function fitToScreen(){
    const f=flows[curFlow],cw=wrapEl.clientWidth,ch=wrapEl.clientHeight;
    scale=Math.min(cw/f.cw,ch/f.ch)*.95;
    applyZoom();wrapEl.scrollTo({left:0,top:0,behavior:'smooth'});
}

/* ── TAB SWITCH ─────────────────────────────────────── */
function switchTab(fid){
    curFlow=fid;const f=flows[fid];
    document.querySelectorAll('.tab-btn').forEach(b=>{
        const act=b.dataset.flow===fid;
        b.classList.toggle('active',act);
        if(act){b.style.background=f.color;b.style.color='#fff'}
        else{const o=flows[b.dataset.flow];b.style.background=o.bg;b.style.color=o.color}
    });
    svgEl.style.opacity=0;
    setTimeout(()=>{renderFlow(fid);buildSidebar(fid);svgEl.style.opacity=1;setTimeout(fitToScreen,60)},80);
}

svgEl.style.transition='opacity .15s';
wrapEl.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?.08:-.08)},{passive:false});
switchTab('student');
</script>
