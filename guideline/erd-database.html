// ─── PORT COMPUTATION ──────────────────────
function colY(tbl,colName){
    const idx=tbl.cols.findIndex(c=>c[0]===colName);
    return tbl.y+HH+idx*RH+RH/2;
}
function tblCenter(t){return{x:t.x+TW/2,y:t.y+t._h/2}}

function getRelPorts(r){
    const pt=tblMap[r.pk],ft=tblMap[r.fk];
    const pc=tblCenter(pt),fc=tblCenter(ft);
    const dx=fc.x-pc.x,dy=fc.y-pc.y;
    const sameCol=Math.abs(dx)<TW*0.9;
    let ps,fs;
    if(sameCol){ps=dy>0?'bottom':'top';fs=dy>0?'top':'bottom'}
    else{ps=dx>0?'right':'left';fs=dx>0?'left':'right'}

    let p1,p2;
    const fkIdx=ft.cols.findIndex(c=>c[0]===r.fkCol);
    const fkY=ft.y+HH+fkIdx*RH+RH/2;

    if(fs==='left'){p2={x:ft.x,y:fkY}}
    else if(fs==='right'){p2={x:ft.x+TW,y:fkY}}
    else if(fs==='top'){p2={x:ft.x+TW/2,y:ft.y}}
    else{p2={x:ft.x+TW/2,y:ft.y+ft._h}}

    const targetY=p2.y;
    if(ps==='right'){p1={x:pt.x+TW,y:Math.max(pt.y+HH+4,Math.min(pt.y+pt._h-4,targetY))}}
    else if(ps==='left'){p1={x:pt.x,y:Math.max(pt.y+HH+4,Math.min(pt.y+pt._h-4,targetY))}}
    else if(ps==='bottom'){p1={x:pt.x+TW/2,y:pt.y+pt._h}}
    else{p1={x:pt.x+TW/2,y:pt.y}}

    return{p1,p2,ps,fs};
}

function routePath(p1,p2,ps,fs){
    if(ps==='right'&&fs==='left'){const mx=(p1.x+p2.x)/2;return`M${p1.x},${p1.y}L${mx},${p1.y}L${mx},${p2.y}L${p2.x},${p2.y}`}
    if(ps==='left'&&fs==='right'){const mx=(p1.x+p2.x)/2;return`M${p1.x},${p1.y}L${mx},${p1.y}L${mx},${p2.y}L${p2.x},${p2.y}`}
    if(ps==='bottom'&&fs==='top'){
        if(Math.abs(p1.x-p2.x)<3)return`M${p1.x},${p1.y}L${p2.x},${p2.y}`;
        const my=(p1.y+p2.y)/2;return`M${p1.x},${p1.y}L${p1.x},${my}L${p2.x},${my}L${p2.x},${p2.y}`}
    if(ps==='top'&&fs==='bottom'){
        const my=(p1.y+p2.y)/2;return`M${p1.x},${p1.y}L${p1.x},${my}L${p2.x},${my}L${p2.x},${p2.y}`}
    if(ps==='right'&&fs==='top'){return`M${p1.x},${p1.y}L${p2.x},${p1.y}L${p2.x},${p2.y}`}
    if(ps==='bottom'&&fs==='left'){return`M${p1.x},${p1.y}L${p1.x},${p2.y}L${p2.x},${p2.y}`}
    return`M${p1.x},${p1.y}L${p2.x},${p2.y}`;
}

function drawCrowsFoot(g,x,y,side,color){
    const d=9,s=6;
    if(side==='left'){
        mk('line',{x1:x,y1:y,x2:x-d,y2:y-s,stroke:color,'stroke-width':1.5},g);
        mk('line',{x1:x,y1:y,x2:x-d,y2:y+s,stroke:color,'stroke-width':1.5},g);
    }else if(side==='right'){
        mk('line',{x1:x,y1:y,x2:x+d,y2:y-s,stroke:color,'stroke-width':1.5},g);
        mk('line',{x1:x,y1:y,x2:x+d,y2:y+s,stroke:color,'stroke-width':1.5},g);
    }else if(side==='top'){
        mk('line',{x1:x,y1:y,x2:x-s,y2:y-d,stroke:color,'stroke-width':1.5},g);
        mk('line',{x1:x,y1:y,x2:x+s,y2:y-d,stroke:color,'stroke-width':1.5},g);
    }else{
        mk('line',{x1:x,y1:y,x2:x-s,y2:y+d,stroke:color,'stroke-width':1.5},g);
        mk('line',{x1:x,y1:y,x2:x+s,y2:y+d,stroke:color,'stroke-width':1.5},g);
    }
}

function drawOneMark(g,x,y,side,color){
    const d=8,s=6;
    if(side==='right'){mk('line',{x1:x+d,y1:y-s,x2:x+d,y2:y+s,stroke:color,'stroke-width':1.5},g)}
    else if(side==='left'){mk('line',{x1:x-d,y1:y-s,x2:x-d,y2:y+s,stroke:color,'stroke-width':1.5},g)}
    else if(side==='bottom'){mk('line',{x1:x-s,y1:y+d,x2:x+s,y2:y+d,stroke:color,'stroke-width':1.5},g)}
    else{mk('line',{x1:x-s,y1:y-d,x2:x+s,y2:y-d,stroke:color,'stroke-width':1.5},g)}
}

// ─── ZOOM & PAN ───────────────────────────
const svgEl=document.getElementById('svg'),wrapEl=document.getElementById('canvas-wrap');
let scale=1,gRoot;
function applyZoom(){
    svgEl.setAttribute('width',CW*scale);
    svgEl.setAttribute('height',CH*scale);
    gRoot.setAttribute('transform',`scale(${scale})`);
    document.getElementById('zoom-pct').textContent=Math.round(scale*100)+'%';
}
function zoomBy(d){scale=Math.max(.25,Math.min(2.2,scale+d));applyZoom()}
function fitToScreen(){
    const cw=wrapEl.clientWidth,ch=wrapEl.clientHeight;
    scale=Math.min(cw/CW,ch/CH)*.95;
    applyZoom();wrapEl.scrollTo({left:0,top:0,behavior:'smooth'});
}

// ─── TOOLTIP ──────────────────────────────
const tip=document.getElementById('tooltip');
function showTip(ev,tbl){
    const g=groups[tbl.g];
    tip.querySelector('.tt').innerHTML=`<span style="color:${g.color}">■</span> ${tbl.name}`;
    tip.querySelector('.td').textContent=tbl.desc;
    let colsHtml=`<b>${tbl.cols.length} cột:</b> `;
    colsHtml+=tbl.cols.map(c=>{
        let badge='';
        if(c[2].includes('pk'))badge='<span style="color:#d97706;font-weight:700">PK</span> ';
        if(c[2].includes('fk'))badge+='<span style="color:#3b82f6;font-weight:700">FK</span> ';
        return badge+c[0]+' <span style="color:#94a3b8">'+c[1]+'</span>';
    }).join(', ');
    tip.querySelector('.tc').innerHTML=colsHtml;
    tip.style.display='block';
    tip.style.left=Math.min(ev.clientX+14,innerWidth-400)+'px';
    tip.style.top=Math.min(ev.clientY+14,innerHeight-160)+'px';
}
function hideTip(){tip.style.display='none'}

// ─── FILTER ───────────────────────────────
let curFilter='all';
function setFilter(f){
    curFilter=f;
    document.querySelectorAll('.fbtn').forEach(b=>{
        const act=b.dataset.f===f;
        if(f==='all'){
            b.style.background=b.dataset.f==='all'?'#1e293b':'';
            b.style.color=b.dataset.f==='all'?'#fff':'';
        }else{
            const gc=groups[f]?.color||'#1e293b';
            b.style.background=act?gc:'';
            b.style.color=act?'#fff':'';
        }
    });
    applyVis();
}
function applyVis(){
    const f=curFilter;
    document.querySelectorAll('.tbl-group').forEach(g=>{
        g.style.opacity=f==='all'||g.dataset.group===f?1:.12;
    });
    document.querySelectorAll('.rel-line').forEach(p=>{
        const pg=tblMap[p.dataset.pk]?.g,fg=tblMap[p.dataset.fk]?.g;
        const match=f==='all'||pg===f||fg===f;
        p.style.opacity=match?(f==='all'?.35:.7):.04;
        p.style.strokeWidth=match&&f!=='all'?2:1.2;
    });
    document.querySelectorAll('.grp-bg').forEach(r=>{
        r.style.opacity=f==='all'||r.dataset.group===f?1:.08;
    });
}

// ─── FOCUS ────────────────────────────────
let focusedTbl=null;
function focusTbl(id){
    focusedTbl=focusedTbl===id?null:id;
    document.querySelectorAll('.tbl-group').forEach(g=>{
        if(!focusedTbl){g.style.opacity=curFilter==='all'||g.dataset.group===curFilter?1:.12;return}
        const connected=id===g.dataset.id||rels.some(r=>(r.pk===id&&r.fk===g.dataset.id)||(r.fk===id&&r.pk===g.dataset.id));
        g.style.opacity=connected?1:.12;
        g.classList.toggle('focused',g.dataset.id===id);
    });
    document.querySelectorAll('.rel-line').forEach(p=>{
        if(!focusedTbl){applyVis();return}
        const match=p.dataset.pk===id||p.dataset.fk===id;
        p.style.opacity=match?.85:.04;
        p.style.strokeWidth=match?2.2:1;
    });
    document.querySelectorAll('.sb-item').forEach(i=>i.classList.toggle('active',i.dataset.tbl===focusedTbl));
    if(focusedTbl){
        const t=tblMap[focusedTbl];
        const cx=(t.x+TW/2)*scale-wrapEl.clientWidth/2;
        const cy=(t.y+t._h/2)*scale-wrapEl.clientHeight/2;
        wrapEl.scrollTo({left:cx,top:cy,behavior:'smooth'});
    }
}

// ─── GROUP BOUNDS ─────────────────────────
function computeGroupBounds(){
    const res={};
    for(const gid of groupOrder){
        const gt=tables.filter(t=>t.g===gid);
        if(!gt.length)continue;
        const pad=18,hpad=28;
        const x1=Math.min(...gt.map(t=>t.x))-pad;
        const y1=Math.min(...gt.map(t=>t.y))-hpad;
        const x2=Math.max(...gt.map(t=>t.x+TW))+pad;
        const y2=Math.max(...gt.map(t=>t.y+t._h))+pad;
        res[gid]={x:x1,y:y1,w:x2-x1,h:y2-y1};
    }
    return res;
}

// ─── RENDER ───────────────────────────────
function render(){
    svgEl.setAttribute('viewBox',`0 0 ${CW} ${CH}`);
    gRoot=mk('g',{},svgEl);

    const defs=mk('defs',{},gRoot);
    const fs=mk('filter',{id:'shadow',x:'-6%',y:'-6%',width:'118%',height:'124%'},defs);
    mk('feDropShadow',{dx:0,dy:2,stdDeviation:3,'flood-opacity':.07},fs);
    const fg=mk('filter',{id:'glow',x:'-12%',y:'-12%',width:'130%',height:'130%'},defs);
    mk('feDropShadow',{dx:0,dy:0,stdDeviation:6,'flood-color':'#3b82f6','flood-opacity':.25},fg);

    // Canvas background
    mk('rect',{x:0,y:0,width:CW,height:CH,fill:'#f8fafc',rx:0},gRoot);

    // Group backgrounds
    const bounds=computeGroupBounds();
    for(const[gid,b]of Object.entries(bounds)){
        const g=groups[gid];
        const bg=mk('g',{class:'grp-bg','data-group':gid},gRoot);
        mk('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:12,fill:g.bg,stroke:g.border,'stroke-width':1,'stroke-dasharray':'6 3',opacity:.7},bg);
        mk('text',{x:b.x+10,y:b.y+14,'font-size':9.5,'font-weight':'700',fill:g.color,opacity:.8,'dominant-baseline':'hanging'},bg).textContent=g.label;
    }

    // Relationship lines
    const relLayer=mk('g',{},gRoot);
    rels.forEach((r,ri)=>{
        const rp=getRelPorts(r);
        const pkG=groups[tblMap[r.pk].g],fkG=groups[tblMap[r.fk].g];
        const color=fkG.color;
        const rg=mk('g',{class:'rel-line','data-pk':r.pk,'data-fk':r.fk,'data-idx':ri},relLayer);
        const path=routePath(rp.p1,rp.p2,rp.ps,rp.fs);
        mk('path',{d:path,fill:'none',stroke:color,'stroke-width':1.2,'stroke-opacity':.35},rg);

        drawOneMark(rg,rp.p1.x,rp.p1.y,rp.ps,color);
        drawCrowsFoot(rg,rp.p2.x,rp.p2.y,rp.fs,color);

        // "1" and "N" labels
        const l1Off=16,l2Off=16;
        let l1x=rp.p1.x,l1y=rp.p1.y,l2x=rp.p2.x,l2y=rp.p2.y;
        if(rp.ps==='right'){l1x+=l1Off;l1y-=10}
        else if(rp.ps==='left'){l1x-=l1Off;l1y-=10}
        else if(rp.ps==='bottom'){l1x+=10;l1y+=l1Off}
        else{l1x+=10;l1y-=l1Off}
        if(rp.fs==='left'){l2x-=l2Off;l2y-=10}
        else if(rp.fs==='right'){l2x+=l2Off;l2y-=10}
        else if(rp.fs==='top'){l2x+=10;l2y-=l2Off}
        else{l2x+=10;l2y+=l2Off}

        mk('text',{x:l1x,y:l1y,'text-anchor':'middle','font-size':9,fill:color,'font-weight':'700',opacity:.6},rg).textContent='1';
        mk('text',{x:l2x,y:l2y,'text-anchor':'middle','font-size':9,fill:color,'font-weight':'700',opacity:.6},rg).textContent='N';
    });

    // Tables
    const tblLayer=mk('g',{},gRoot);
    tables.forEach(t=>{
        const g=mk('g',{class:'tbl-group','data-id':t.id,'data-group':t.g},tblLayer);
        const gc=groups[t.g];
        const h=t._h;

        // Shadow rect
        mk('rect',{x:t.x,y:t.y,width:TW,height:h,rx:6,fill:'#fff',filter:'url(#shadow)',class:'tbl-shadow'},g);

        // Header
        mk('rect',{x:t.x,y:t.y,width:TW,height:HH,rx:6,fill:gc.color},g);
        mk('rect',{x:t.x,y:t.y+HH-6,width:TW,height:6,fill:gc.color},g);
        mk('text',{x:t.x+TW/2,y:t.y+HH/2+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':11,'font-weight':'700',fill:'#fff','font-family':'monospace'},g).textContent=t.name;

        // Columns
        t.cols.forEach((c,i)=>{
            const ry=t.y+HH+i*RH;
            if(i%2===0)mk('rect',{x:t.x,y:ry,width:TW,height:RH,fill:'#f8fafc'},g);

            // PK/FK badge
            let bx=t.x+6;
            if(c[2].includes('pk')){
                mk('rect',{x:bx,y:ry+3,width:16,height:12,rx:2,fill:'#fef3c7'},g);
                mk('text',{x:bx+8,y:ry+RH/2,'text-anchor':'middle','dominant-baseline':'middle','font-size':7,'font-weight':'800',fill:'#d97706'},g).textContent='PK';
                bx+=19;
            }
            if(c[2].includes('fk')){
                mk('rect',{x:bx,y:ry+3,width:16,height:12,rx:2,fill:'#dbeafe'},g);
                mk('text',{x:bx+8,y:ry+RH/2,'text-anchor':'middle','dominant-baseline':'middle','font-size':7,'font-weight':'800',fill:'#2563eb'},g).textContent='FK';
                bx+=19;
            }
            if(c[2].includes('uq')){
                mk('rect',{x:bx,y:ry+3,width:16,height:12,rx:2,fill:'#dcfce7'},g);
                mk('text',{x:bx+8,y:ry+RH/2,'text-anchor':'middle','dominant-baseline':'middle','font-size':7,'font-weight':'800',fill:'#16a34a'},g).textContent='UQ';
                bx+=19;
            }

            // Column name
            const nameX=c[2]?bx+3:t.x+8;
            mk('text',{x:nameX,y:ry+RH/2,'dominant-baseline':'middle','font-size':10,fill:'#1e293b','font-weight':'500','font-family':'monospace'},g).textContent=c[0];

            // Type
            mk('text',{x:t.x+TW-6,y:ry+RH/2,'text-anchor':'end','dominant-baseline':'middle','font-size':9,fill:'#94a3b8','font-family':'monospace'},g).textContent=c[1];
        });

        // Bottom border radius
        mk('rect',{x:t.x,y:t.y+h-1,width:TW,height:1,fill:'#e2e8f0'},g);

        // Border
        mk('rect',{x:t.x,y:t.y,width:TW,height:h,rx:6,fill:'none',stroke:'#e2e8f0','stroke-width':1},g);

        // Events
        g.addEventListener('mouseenter',e=>showTip(e,t));
        g.addEventListener('mousemove',e=>showTip(e,t));
        g.addEventListener('mouseleave',hideTip);
        g.addEventListener('click',()=>focusTbl(t.id));
    });

    // Title
    mk('text',{x:CW/2,y:28,'text-anchor':'middle','font-size':14,'font-weight':'700',fill:'#1e293b','letter-spacing':'.3'},gRoot).textContent='Entity-Relationship Diagram – High School Learning Analytics Dashboard';

    applyZoom();
    applyVis();
}

// ─── SIDEBAR ──────────────────────────────
function buildSidebar(){
    const el=document.getElementById('sb-list');
    let h='';
    for(const gid of groupOrder){
        const g=groups[gid];
        const gt=tables.filter(t=>t.g===gid);
        h+=`<div class="sb-group">
            <div class="sb-ghdr" onclick="this.nextElementSibling.style.maxHeight=this.nextElementSibling.style.maxHeight?'':'600px';this.querySelector('.sb-chev').classList.toggle('open')">
                <span class="sb-dot" style="background:${g.color}"></span>
                <span style="color:${g.color}">${g.label}</span>
                <span class="sb-cnt">${gt.length}</span>
                <span class="sb-chev open">▸</span>
            </div>
            <div class="sb-items" style="max-height:600px">`;
        gt.forEach(t=>{
            h+=`<div class="sb-item" data-tbl="${t.id}" onclick="focusTbl('${t.id}')">
                <span class="sb-item-name">${t.name}</span>
                <span class="sb-item-cnt">${t.cols.length} cols</span>
            </div>`;
        });
        h+=`</div></div>`;
    }
    el.innerHTML=h;
}

// ─── FILTER BAR ───────────────────────────
function buildFilterBar(){
    const bar=document.getElementById('filter-bar');
    let h='<button data-f="all" onclick="setFilter(\'all\')" class="fbtn px-2.5 py-1 rounded-md text-[11px] font-semibold bg-gray-800 text-white">Tất cả</button>';
    for(const gid of groupOrder){
        const g=groups[gid];
        h+=`<button data-f="${gid}" onclick="setFilter('${gid}')" class="fbtn px-2.5 py-1 rounded-md text-[11px] font-semibold hover:opacity-80" style="background:${g.bg};color:${g.color}">${g.label.split(' ').slice(0,2).join(' ')}</button>`;
    }
    bar.innerHTML=h;
}

// ─── INIT ─────────────────────────────────
wrapEl.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?.08:-.08)},{passive:false});
buildFilterBar();
render();
buildSidebar();
setTimeout(fitToScreen,80);
</script>
</body>
